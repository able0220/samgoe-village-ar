<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비석 중심 인식 시험</title><style>body{font:16px system-ui;margin:20px;background:#f6f3e9;color:#163d33}button,a{padding:15px;margin:8px;display:inline-block}video{width:100%;max-height:50vh;object-fit:contain;background:#111}canvas{max-width:28%;max-height:180px;margin:6px}#result{font-size:24px;font-weight:bold}</style><h1>비석 중심 인식 시험</h1><p>6·9·11번의 글자 있는 돌 앞면만 인식 대상으로 등록했습니다. 아래 영역을 카메라에 크게 담아 주세요.</p><div id="samples"></div><button id="start">카메라 시험 시작</button><p id="status" role="status">준비 중</p><video autoplay muted playsinline></video><p id="result" role="status"></p><a id="play" hidden>게임 시작</a><script type="module">
import {Controller} from './vendor/mindar-image.prod.js';
const regions=await(await fetch('./stone-regions.json')).json();
for(const {id,box:[x,y,w,h]} of regions){const im=new Image();im.src=`assets/photos/${id}.jpg`;await im.decode();const c=document.createElement('canvas');c.width=Math.round(im.width*w);c.height=Math.round(im.height*h);c.title=`${id}번 비석`;c.getContext('2d').drawImage(im,x*im.width,y*im.height,w*im.width,h*im.height,0,0,c.width,c.height);document.querySelector('#samples').append(c);}
document.querySelector('#status').textContent='6·9·11번 준비 완료';
let controller,stream;
document.querySelector('#start').onclick=async()=>{try{document.querySelector('#start').disabled=true;const v=document.querySelector('video');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});v.srcObject=stream;await v.play();const buf=await(await fetch('./stone-test.mind')).arrayBuffer();controller=new Controller({inputWidth:v.videoWidth,inputHeight:v.videoHeight,maxTrack:1,warmupTolerance:2,onUpdate:({type,targetIndex,worldMatrix})=>{if(type==='updateMatrix'&&worldMatrix){const id=regions[targetIndex].id;document.querySelector('#result').textContent=`${id}번 비석 인식 성공`;const a=document.querySelector('#play');a.href=`game.html?id=${id}`;a.hidden=false;}}});controller.addImageTargetsFromBuffer(buf);controller.dummyRun(v);controller.processVideo(v);document.querySelector('#status').textContent='비석 앞면을 정면에서 크게 비춰 주세요';}catch(e){document.querySelector('#status').textContent=e.message;document.querySelector('#start').disabled=false;}};
window.addEventListener('pagehide',()=>{controller?.stopProcessVideo();stream?.getTracks().forEach(t=>t.stop());});
</script></html>
