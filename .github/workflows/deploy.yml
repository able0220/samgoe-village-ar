name: Deploy village AR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand initial source upload
        shell: bash
        run: |
          if [ -f site-source.zip ]; then
            unzip -q -o site-source.zip
            mkdir -p assets/targets
            mv villages.mind assets/targets/villages.mind
            rm site-source.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Import complete village AR source and recognition assets"
            git push origin HEAD:main
          fi
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html app.js core.js game.html game.js styles.css aframe-test.html stone-test.html stone-regions.json stone-test.mind .nojekyll _site/
          cp -R assets games vendor _site/
          test -s _site/assets/targets/villages.mind
          test "$(find _site/games -name '*.html' | wc -l)" -eq 27
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
