<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>비석 인식 · 기존 방식 비교 시험</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:white}a-scene{position:fixed!important;inset:0;z-index:1}body>video{z-index:0!important}.bar{position:fixed;top:15px;left:15px;right:15px;z-index:10;background:#143c32e8;border-radius:16px;padding:16px;pointer-events:none}.bar h1{font-size:18px;margin:0 0 8px}.bar p{font-size:13px;margin:5px 0}.panel{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,430px);padding:25px;background:#f6f3e9;color:#143c32;border-radius:20px}button,a.play{display:block;border:0;border-radius:12px;background:#164c3d;color:white;padding:17px;text-align:center;font:700 16px system-ui;text-decoration:none;width:100%;margin:15px 0 0}button:disabled{opacity:.5}.hidden{display:none!important}#found{top:auto;bottom:25px;transform:translateX(-50%)}#found h2{margin:0}.links{position:fixed;z-index:12;bottom:15px;right:15px;background:#fff;padding:10px;border-radius:9px;color:#143c32;font-size:12px}</style></head><body>
<div class="bar"><h1>비석 인식 · 기존 방식 비교 시험</h1><p id="status" role="status">6·9·11번 / 기존 사이트와 같은 A-Frame 실행 구조</p><p>비석의 글자 있는 앞면을 비춰 주세요.</p></div>
<section id="start" class="panel"><h2>기존 방식으로 시험하기</h2><p>기존 AR_test_1과 같은 MindAR 1.2.5 + A-Frame 1.5.0을 사용합니다. 비교를 위해 비석 인식 데이터는 이전 시험과 동일합니다.</p><button id="begin">카메라 시작</button><p id="message" role="status"></p></section>
<section id="found" class="panel hidden"><h2 id="title"></h2><p>비석 인식에 성공했습니다.</p><a id="play" class="play">게임 시작</a><button id="again">다시 탐색</button></section>
<a class="links" href="stone-test.html">이전 방식 시험으로 이동</a>
<a-scene id="scene" mindar-image="imageTargetSrc: ./stone-test.mind; maxTrack: 1; autoStart: false;" color-space="sRGB" renderer="colorManagement: true; antialias: true; alpha: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity mindar-image-target="targetIndex:0" id="target0"></a-entity><a-entity mindar-image-target="targetIndex:1" id="target1"></a-entity><a-entity mindar-image-target="targetIndex:2" id="target2"></a-entity>
</a-scene><script>
const ids=[6,9,11],$=id=>document.getElementById(id),scene=$('scene');let system,found=false,cooldown=0;
function ready(){return new Promise((resolve,reject)=>{const read=()=>{const s=scene.systems?.['mindar-image-system'];s?resolve(s):reject(Error('인식 엔진 초기화 실패'));};if(scene.hasLoaded)return read();const t=setTimeout(()=>reject(Error('장면 준비 시간 초과. 인터넷 연결을 확인하세요.')),20000);scene.addEventListener('loaded',()=>{clearTimeout(t);read();},{once:true});});}
$('begin').onclick=async()=>{try{$('begin').disabled=true;$('message').textContent='인식 자료 확인 중…';if(!isSecureContext)throw Error('HTTPS 주소로 접속하세요.');const r=await fetch('./stone-test.mind');if(!r.ok)throw Error('인식 데이터 로드 실패');system=await ready();$('message').textContent='카메라와 인식 엔진 준비 중…';await system.start();$('start').classList.add('hidden');}catch(e){$('message').textContent=e.message||'카메라 시작 실패';$('begin').disabled=false;}};
scene.addEventListener('arReady',()=>{$('start').classList.add('hidden');$('status').textContent='인식 실행 중 · 6·9·11번 비석을 비춰 주세요';});
scene.addEventListener('arError',()=>{$('message').textContent='카메라 또는 인식 엔진 오류';$('begin').disabled=false;});
ids.forEach((id,i)=>{$('target'+i).addEventListener('targetFound',()=>{if(found||Date.now()<cooldown)return;found=true;$('status').textContent=id+'번 비석 인식 성공';$('title').textContent=id+'번 비석 발견!';$('play').href='game.html?id='+id;$('found').classList.remove('hidden');});});
$('again').onclick=()=>{found=false;cooldown=Date.now()+2000;$('found').classList.add('hidden');$('status').textContent='다른 비석을 비춰 주세요';};
window.addEventListener('pagehide',()=>{try{system?.stop();}catch{}});
</script></body></html>
